<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travis</title>

  <style>
    body {
      margin: 0;
      background: #080b10;
      color: white;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 90%;
      max-width: 500px;
    }

    h1 {
      text-align: center;
      font-size: 42px;
      margin-bottom: 5px;
    }

    .status {
      text-align: center;
      color: #8d96a5;
      margin-bottom: 30px;
    }

    .chat {
      background: #11161e;
      border-radius: 20px;
      padding: 20px;
      min-height: 100px;
      margin-bottom: 15px;
    }

    .input-box {
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      padding: 15px;
      border-radius: 14px;
      border: none;
      background: #1b222d;
      color: white;
      font-size: 16px;
      outline: none;
    }

    button {
      padding: 15px;
      border: none;
      border-radius: 14px;
      background: white;
      color: black;
      font-weight: bold;
    }

    .mic {
      width: 100%;
      margin-top: 10px;
      background: #1b222d;
      color: white;
      font-size: 18px;
    }

    .memory {
      margin-top: 20px;
      background: #11161e;
      border-radius: 20px;
      padding: 15px;
    }

    .memory-title {
      color: #8d96a5;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>TRAVIS</h1>
  <div class="status">Dein persönlicher Assistent</div>

  <div class="chat" id="chat">
    Hey 👋 Ich bin Travis.
  </div>

  <div class="input-box">
    <input
      id="message"
      type="text"
      placeholder="Sag Travis etwas..."
    >

    <button onclick="sendMessage()">Senden</button>
  </div>

  <button class="mic" onclick="startListening()">
    🎙️ Mit Travis sprechen
  </button>

  <div class="memory">
    <div class="memory-title">🧠 Travis' Gedächtnis</div>
    <div id="memoryList">Noch nichts gespeichert.</div>
  </div>

</div>

<script>

  let memories = JSON.parse(
    localStorage.getItem("travisMemory") || "[]"
  );

  function showMemories() {

    const list = document.getElementById("memoryList");

    if (memories.length === 0) {
      list.innerHTML = "Noch nichts gespeichert.";
      return;
    }

    list.innerHTML = memories
      .map(memory => "• " + memory)
      .join("<br>");
  }

  function sendMessage() {

    const input = document.getElementById("message");
    const chat = document.getElementById("chat");

    const message = input.value.trim();

    if (message === "") return;

    chat.innerHTML = "<b>Du:</b> " + message;

    memories.push(message);

    localStorage.setItem(
      "travisMemory",
      JSON.stringify(memories)
    );

    input.value = "";

    showMemories();
  }

  function startListening() {

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      alert("Dein Browser unterstützt diese Spracheingabe leider nicht.");
      return;
    }

    const recognition = new SpeechRecognition();

    recognition.lang = "de-DE";
    recognition.interimResults = false;
    recognition.continuous = false;

    recognition.start();

    document.getElementById("chat").innerHTML =
      "🎙️ Ich höre zu...";

    recognition.onresult = function(event) {

      const text =
        event.results[0][0].transcript;

      document.getElementById("message").value = text;

      sendMessage();
    };

    recognition.onerror = function() {

      document.getElementById("chat").innerHTML =
        "Ich konnte dich leider nicht verstehen.";

    };
  }

  showMemories();

</script>

</body>
</html>
